[project]
name = "grand-cinema"
version = "1.0.0"
description = "Application web de réservation de places pour Le Grand Cinéma"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
